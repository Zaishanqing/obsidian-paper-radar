[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-paper-radar"
version = "0.2.0"
description = "DeepSeek API 驱动的 Obsidian 每日论文自动筛选与推送系统"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Obsidian Paper Radar contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyYAML>=6.0,<7",
    "requests>=2.28,<3",
    "PyMuPDF>=1.23,<2",
    "arxiv>=2.0,<3",
    "Pillow>=10,<13",
    "acl-anthology>=1.2,<2",
    "openreview-py>=1.50,<2",
]

[project.scripts]
obsidian-paper-radar = "obsidian_paper_radar.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "pytest-cov>=4,<7",
    "ruff>=0.4,<1",
]
med = ["pymed>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
